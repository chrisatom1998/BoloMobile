name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run audit:gate

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          # Static configuration fixture only; this job does not deploy a Live server.
          BOLO_LIVE_API_URL: https://live.example.test

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm run lint --prefix website
      - run: npm test --prefix website

  expo-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx --no-install expo-doctor

  ios-prebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Validate generated native configuration
        run: node scripts/validate-native-project.mjs

  production-config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EAS_BUILD_PROFILE: production
      BOLO_APP_IDENTIFIER: com.bolo.hindi
      BOLO_EAS_PROJECT_ID: 573b5aad-b676-44aa-8ec4-34b831b6d5ff
      BOLO_EXPO_OWNER: appdevcmjatom
      # Static configuration fixture only; never use this endpoint in a shipping build.
      BOLO_LIVE_API_URL: https://live.example.test
      BOLO_PUBLISHER_NAME: Bolo CI
      BOLO_SUPPORT_EMAIL: ci@example.com
      BOLO_REVIEW_FIRST_NAME: CI
      BOLO_REVIEW_LAST_NAME: Reviewer
      BOLO_REVIEW_EMAIL: reviewer@example.com
      BOLO_REVIEW_PHONE: "+15555550100"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run production:validate

  ios-native-build:
    # No `needs:` on purpose. This is the slowest job, so it starts right away
    # instead of waiting for the quick Linux checks. `required-checks` still
    # fails the merge if any of those checks fail.
    runs-on: macos-26
    timeout-minutes: 75
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      # ccache settings for the C, C++ and Objective-C compiles (same options
      # React Native's own ccache.conf uses). Swift is not cached.
      CCACHE_MAXSIZE: 2G
      CCACHE_SLOPPINESS: clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
      CCACHE_FILECLONE: "true"
      CCACHE_DEPEND: "true"
      CCACHE_INODECACHE: "true"
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - run: npm ci
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install ccache
        run: |
          command -v ccache >/dev/null || brew install ccache
          echo "CCACHE_DIR=$HOME/Library/Caches/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BIN=$(command -v ccache)" >> "$GITHUB_ENV"
      - name: Restore the compiler cache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-xcode26.6-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-ios-xcode26.6-${{ hashFiles('package-lock.json') }}-
            ccache-ios-xcode26.6-
      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios --repo-update
      - name: Validate App Intents and the local Expo module
        run: node scripts/validate-native-project.mjs --require-workspace
      # arm64 only: the hosted macOS runners and the smoke-test simulator are Apple
      # silicon. Release would otherwise compile every file twice (arm64 + x86_64).
      # Xcode 26 builds with explicit modules, so ccache goes in as a compiler
      # launcher; the Podfile's CC override is silently bypassed.
      - name: Build unsigned Release app for the simulator
        run: |
          ccache --zero-stats
          xcodebuild \
            -workspace ios/Bolo.xcworkspace \
            -scheme Bolo \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/BoloDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            C_COMPILER_LAUNCHER="$CCACHE_BIN" \
            CLANG_ENABLE_EXPLICIT_MODULES_WITH_COMPILER_LAUNCHER=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Show compiler cache hit rate
        if: always()
        run: ccache --show-stats --verbose || true
      - name: Save the compiler cache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-xcode26.6-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
      - name: Package simulator app
        run: |
          app="$RUNNER_TEMP/BoloDerivedData/Build/Products/Release-iphonesimulator/Bolo.app"
          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/Bolo-simulator.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bolo-ios-simulator-${{ github.sha }}
          path: ${{ runner.temp }}/Bolo-simulator.zip
          if-no-files-found: error
          retention-days: 3

  maestro-smoke:
    needs: ios-native-build
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CI: 1
      MAESTRO_CLI_NO_ANALYTICS: 1
      # Maestro 2.8.0 reads this value in milliseconds; hosted simulators can boot slowly.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
      MAESTRO_VERSION: 2.8.0
      MAESTRO_SHA256: b3e561161904fb391875ca5834d5b22cf0b01c052dd1b408ad83e30d8f8951b3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bolo-ios-simulator-${{ github.sha }}
          path: ${{ runner.temp }}/bolo-artifact
      - name: Unpack simulator app
        run: |
          ditto -x -k "$RUNNER_TEMP/bolo-artifact/Bolo-simulator.zip" "$RUNNER_TEMP/bolo-app"
          test -d "$RUNNER_TEMP/bolo-app/Bolo.app"
      - name: Create and boot the simulator
        shell: bash
        run: |
          set -euo pipefail
          # Pin the runtime that ships with the selected Xcode 26.6. Sorting to the
          # newest installed iOS runtime moves this job whenever the image adds one.
          pinned_runtime="com.apple.CoreSimulator.SimRuntime.iOS-26-5"
          runtime_id="$(xcrun simctl list runtimes --json | jq -r --arg id "$pinned_runtime" '[.runtimes[] | select(.isAvailable and .identifier == $id)] | first | .identifier // empty')"
          device_type_id="$(xcrun simctl list devicetypes --json | jq -r '[.devicetypes[] | select(.name == "iPhone 16 Pro") | .identifier] | first // empty')"
          if [[ -z "$runtime_id" || -z "$device_type_id" ]]; then
            echo "::error::Pinned iOS 26.5 runtime (${pinned_runtime}) or iPhone 16 Pro device type is not available."
            xcrun simctl list runtimes
            xcrun simctl list devicetypes
            exit 1
          fi
          echo "Using runtime ${runtime_id} and device type ${device_type_id}"
          udid="$(xcrun simctl create "Bolo CI $GITHUB_RUN_ID" "$device_type_id" "$runtime_id")"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          open -a Simulator --args -CurrentDeviceUDID "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Install the app
        run: |
          xcrun simctl install "$SIMULATOR_UDID" "$RUNNER_TEMP/bolo-app/Bolo.app"
          xcrun simctl get_app_container "$SIMULATOR_UDID" com.bolo.hindi app
      - name: Install pinned Maestro CLI
        run: |
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --retry 3 --output "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Run the dedicated iOS smoke flow
        timeout-minutes: 22
        run: |
          set -euo pipefail
          smoke() {
            rm -rf maestro-junit.xml maestro-artifacts
            npm run e2e:ios -- \
              --device "$SIMULATOR_UDID" \
              --format junit \
              --output maestro-junit.xml \
              --debug-output maestro-artifacts/driver-logs \
              --test-output-dir maestro-artifacts
          }
          stash_failed_attempt() {
            # Workspace path, not RUNNER_TEMP. The upload step includes it, so a
            # later timeout of this step still leaves the first attempt's logs.
            rm -rf maestro-attempt-1
            mkdir -p maestro-attempt-1
            if [[ -f maestro-junit.xml ]]; then
              mv maestro-junit.xml maestro-attempt-1/maestro-junit.xml
            fi
            if [[ -d maestro-artifacts ]]; then
              mv maestro-artifacts maestro-attempt-1/maestro-artifacts
            fi
          }
          reboot_simulator() {
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
            xcrun simctl boot "$SIMULATOR_UDID" || true
            open -a Simulator --args -CurrentDeviceUDID "$SIMULATOR_UDID" || true
            xcrun simctl bootstatus "$SIMULATOR_UDID" -b
            xcrun simctl install "$SIMULATOR_UDID" "$RUNNER_TEMP/bolo-app/Bolo.app"
          }
          if smoke; then
            exit 0
          fi
          echo "::warning::iOS smoke flow failed; rebooting the simulator and retrying once."
          {
            echo "### Maestro smoke retry"
            echo "The first \`e2e:ios\` attempt failed. Its logs are in \`maestro-attempt-1/\` and are not copied over the second attempt's JUnit. The simulator was rebooted and the flow ran once more."
          } >> "$GITHUB_STEP_SUMMARY"
          stash_failed_attempt
          reboot_simulator
          smoke
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maestro-smoke-results-${{ github.sha }}
          path: |
            maestro-junit.xml
            maestro-artifacts
            maestro-attempt-1
          if-no-files-found: warn
          retention-days: 7
      - name: Remove simulator
        if: always() && env.SIMULATOR_UDID != ''
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl delete "$SIMULATOR_UDID" || true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed content with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Audit production and full dependency trees against the accepted baseline
        run: node scripts/audit-runtime-dependencies.mjs
      - name: Audit website runtime dependencies
        run: npm --prefix website audit --omit=dev --audit-level=high
      - name: Audit all root dependencies
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Audit all website dependencies
        if: always()
        continue-on-error: true
        run: npm --prefix website audit --audit-level=high
      - name: Review pull-request dependency changes
        if: always() && github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
      - name: Explain disabled dependency review
        if: always() && (github.event_name != 'pull_request' || vars.ENABLE_DEPENDENCY_REVIEW != 'true')
        run: echo "::notice::Dependency Review skipped. Set the repository variable ENABLE_DEPENDENCY_REVIEW=true after GitHub Code Security is available for this private repository."

  required-checks:
    name: required-checks
    if: always()
    needs:
      - dependency-audit
      - verify
      - website
      - expo-doctor
      - ios-prebuild
      - production-config
      - ios-native-build
      - maestro-smoke
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPENDENCY_AUDIT_RESULT: ${{ needs['dependency-audit'].result }}
      VERIFY_RESULT: ${{ needs['verify'].result }}
      WEBSITE_RESULT: ${{ needs['website'].result }}
      EXPO_DOCTOR_RESULT: ${{ needs['expo-doctor'].result }}
      IOS_PREBUILD_RESULT: ${{ needs['ios-prebuild'].result }}
      PRODUCTION_CONFIG_RESULT: ${{ needs['production-config'].result }}
      IOS_NATIVE_BUILD_RESULT: ${{ needs['ios-native-build'].result }}
      MAESTRO_SMOKE_RESULT: ${{ needs['maestro-smoke'].result }}
      SECURITY_RESULT: ${{ needs['security'].result }}
    steps:
      - name: Require every merge check to pass
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          while IFS='=' read -r check result; do
            if [[ "$result" != "success" ]]; then
              echo "::error::Merge check $check completed with result $result."
              failures=1
            fi
          done <<RESULTS
          dependency-audit=$DEPENDENCY_AUDIT_RESULT
          verify=$VERIFY_RESULT
          website=$WEBSITE_RESULT
          expo-doctor=$EXPO_DOCTOR_RESULT
          ios-prebuild=$IOS_PREBUILD_RESULT
          production-config=$PRODUCTION_CONFIG_RESULT
          ios-native-build=$IOS_NATIVE_BUILD_RESULT
          maestro-smoke=$MAESTRO_SMOKE_RESULT
          security=$SECURITY_RESULT
          RESULTS
          exit "$failures"
