name: Asha chat screenshots

# Push, not pull_request. This stacked pull request does not target main, and
# while it conflicts GitHub cannot build the merge ref that pull_request jobs
# need. A push to this branch starts the job from the workflow in the commit.
on:
  push:
    branches:
      - cursor/asha-session-ux

concurrency:
  group: asha-chat-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      MAESTRO_CLI_NO_ANALYTICS: 1
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
      MAESTRO_VERSION: 2.8.0
      MAESTRO_SHA256: b3e561161904fb391875ca5834d5b22cf0b01c052dd1b408ad83e30d8f8951b3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - run: npm ci
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios --repo-update
      - name: Validate App Intents and the local Expo module
        run: node scripts/validate-native-project.mjs --require-workspace
      - name: Build unsigned Release app for the simulator
        run: |
          xcodebuild \
            -workspace ios/Bolo.xcworkspace \
            -scheme Bolo \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/BoloDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Create and boot an iPhone 15
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          runtime_id="$(xcrun simctl list runtimes --json | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')"
          pinned="com.apple.CoreSimulator.SimRuntime.iOS-26-5"
          if xcrun simctl list runtimes --json | jq -e --arg id "$pinned" '.runtimes[] | select(.isAvailable and .identifier == $id)' >/dev/null; then runtime_id="$pinned"; fi
          device_type_id=""
          device_name=""
          for candidate in "iPhone 15" "iPhone 16" "iPhone 15 Pro"; do
            device_type_id="$(xcrun simctl list devicetypes --json | jq -r --arg name "$candidate" '[.devicetypes[] | select(.name == $name) | .identifier] | first // empty')"
            if [[ -n "$device_type_id" ]]; then device_name="$candidate"; break; fi
          done
          if [[ -z "$runtime_id" || -z "$device_type_id" ]]; then
            echo "::error::No iOS runtime or 393x852 iPhone simulator available."
            xcrun simctl list devicetypes
            exit 1
          fi
          echo "Using ${device_name} on ${runtime_id}"
          udid="$(xcrun simctl create "Bolo asha chat $GITHUB_RUN_ID" "$device_type_id" "$runtime_id")"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          open -a Simulator --args -CurrentDeviceUDID "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance light || true
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularMode active --cellularBars 4 || true
      - name: Install the app
        run: |
          app="$RUNNER_TEMP/BoloDerivedData/Build/Products/Release-iphonesimulator/Bolo.app"
          test -d "$app"
          xcrun simctl install "$SIM_UDID" "$app"
          xcrun simctl get_app_container "$SIM_UDID" com.bolo.hindi app
      - name: Install pinned Maestro CLI
        run: |
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --retry 3 --output "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Capture default and one-step-larger Asha chat
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p named-screenshots
          capture() {
            local shot="$1"
            local out="ios-simulator-screenshots-$shot"
            rm -rf "$out"
            maestro test \
              --device "$SIM_UDID" \
              -e "SHOT=$shot" \
              --debug-output "maestro-artifacts-$shot" \
              --test-output-dir "$out" \
              .maestro/screenshots/asha-chat-capture.yaml
            mkdir -p "named-screenshots/all-$shot"
            find "$out" "$HOME/.maestro/tests" -name '*.png' -print 2>/dev/null | sort > "named-screenshots/all-$shot/files.txt" || true
            # Maestro also stores a shot from earlier in the flow. The chat
            # screenshot is the last png written, named for this shot when the
            # takeScreenshot path is expanded.
            png=""
            if [[ -f "$shot.png" ]]; then png="$shot.png"; fi
            if [[ -z "$png" && -f "$out/$shot.png" ]]; then png="$out/$shot.png"; fi
            if [[ -z "$png" ]]; then
              png="$(find "$out" "$HOME/.maestro/tests" -name "$shot.png" -print 2>/dev/null | head -n 1 || true)"
            fi
            if [[ -z "$png" ]]; then
              png="$(find "$out" -name '*.png' -print 2>/dev/null | while IFS= read -r file; do stat -f '%m %N' "$file"; done | sort -n | tail -n 1 | cut -d' ' -f2-)"
            fi
            if [[ -z "$png" || ! -f "$png" ]]; then
              echo "::error::No screenshot produced for $shot"
              find "$out" -print | sort || true
              exit 1
            fi
            echo "Using $png for $shot"
            cp "$png" "named-screenshots/$shot.png"
            find "$out" -name '*.png' -exec cp {} "named-screenshots/all-$shot/" \;
          }
          # "large" is the iOS default content size. "extra-large" is one step up.
          # Set the size before each launch so the app reads it at startup.
          xcrun simctl ui "$SIM_UDID" content_size large
          maestro test \
            --device "$SIM_UDID" \
            --debug-output maestro-artifacts-seed \
            --test-output-dir ios-simulator-screenshots-seed \
            .maestro/screenshots/asha-chat-seed.yaml
          capture asha-chat-default
          xcrun simctl ui "$SIM_UDID" content_size extra-large
          capture asha-chat-larger
          xcrun simctl ui "$SIM_UDID" content_size large || true
          find named-screenshots -name '*.png' | sort
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: asha-chat-screenshots-${{ github.run_id }}
          path: |
            named-screenshots
            ios-simulator-screenshots-asha-chat-default
            ios-simulator-screenshots-asha-chat-larger
            maestro-artifacts-seed
            maestro-artifacts-asha-chat-default
            maestro-artifacts-asha-chat-larger
          if-no-files-found: warn
          retention-days: 14
      - name: Clean up simulator and DerivedData
        if: always()
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl delete "$SIM_UDID" || true
          rm -rf ~/Library/Developer/Xcode/DerivedData/Bolo* || true
