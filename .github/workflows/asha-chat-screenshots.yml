name: Asha chat screenshots

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - .github/workflows/asha-chat-screenshots.yml
      - .maestro/screenshots/**
      - src/app/screenshot-chat.tsx
      - src/lib/screenshot-chat-fixture.ts
      - src/components/chat-message-row.tsx

concurrency:
  group: asha-chat-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'cursor/asha-session-ux'
    runs-on: ${{ vars.SCREENSHOT_RUNNER == 'hosted' && 'macos-26' || fromJSON('["self-hosted","macOS","bolo-screenshots"]') }}
    timeout-minutes: 90
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      MAESTRO_CLI_NO_ANALYTICS: 1
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
      MAESTRO_VERSION: 2.8.0
      MAESTRO_SHA256: b3e561161904fb391875ca5834d5b22cf0b01c052dd1b408ad83e30d8f8951b3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - name: Use the Xcode installed on this runner
        run: |
          set -euo pipefail
          developer=""
          best=0
          for app in /Applications/Xcode*.app; do
            bin="$app/Contents/Developer/usr/bin/xcodebuild"
            if [[ ! -x "$bin" ]]; then
              continue
            fi
            version="$("$bin" -version | awk 'NR==1 { print $2 }')"
            major="${version%%.*}"
            rest="${version#*.}"
            minor="${rest%%.*}"
            score=$((major * 1000 + minor))
            if (( score > best )); then
              best="$score"
              developer="$app/Contents/Developer"
            fi
          done
          if [[ -z "$developer" ]]; then
            developer="$(xcode-select -p)"
          fi
          echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
          echo "Using $developer"
          "$developer/usr/bin/xcodebuild" -version
      - run: npm ci
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios --repo-update
      - name: Validate App Intents and the local Expo module
        run: node scripts/validate-native-project.mjs --require-workspace
      - name: Build unsigned Release app for the simulator
        run: |
          xcodebuild \
            -workspace ios/Bolo.xcworkspace \
            -scheme Bolo \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/BoloDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Create and boot an iPhone 15
        shell: bash
        run: |
          set -euo pipefail
          runtime_id="$(xcrun simctl list runtimes --json | jq -r '[.runtimes[] | select(.isAvailable == true and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')"
          device_type_id="$(xcrun simctl list devicetypes --json | jq -r '[.devicetypes[] | select(.name == "iPhone 15") | .identifier] | first // empty')"
          if [[ -z "$runtime_id" || -z "$device_type_id" ]]; then
            echo "::error::No available iOS runtime or iPhone 15 simulator device type."
            xcrun simctl list runtimes
            xcrun simctl list devicetypes
            exit 1
          fi
          echo "Using iPhone 15 on ${runtime_id}"
          udid="$(xcrun simctl create "Bolo asha chat $GITHUB_RUN_ID" "$device_type_id" "$runtime_id")"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          open -a Simulator --args -CurrentDeviceUDID "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance light || true
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularMode active --cellularBars 4 || true
          xcrun simctl ui "$udid" content_size large
      - name: Install the app
        run: |
          app="$RUNNER_TEMP/BoloDerivedData/Build/Products/Release-iphonesimulator/Bolo.app"
          test -d "$app"
          xcrun simctl install "$SIM_UDID" "$app"
          xcrun simctl get_app_container "$SIM_UDID" com.bolo.hindi app
      - name: Install pinned Maestro CLI
        run: |
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --retry 3 --output "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Capture default and one-step-larger Asha chat
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p named-screenshots
          capture() {
            local shot="$1"
            rm -rf "ios-simulator-screenshots-$shot"
            maestro test \
              --device "$SIM_UDID" \
              -e "SHOT=$shot" \
              --debug-output "maestro-artifacts-$shot" \
              --test-output-dir "ios-simulator-screenshots-$shot" \
              .maestro/screenshots/asha-chat-capture.yaml
            png="$(find "ios-simulator-screenshots-$shot" -name '*.png' -print | head -n 1)"
            if [[ -z "$png" ]]; then
              echo "::error::No screenshot produced for $shot"
              exit 1
            fi
            cp "$png" "named-screenshots/$shot.png"
          }
          maestro test \
            --device "$SIM_UDID" \
            --debug-output maestro-artifacts-seed \
            --test-output-dir ios-simulator-screenshots-seed \
            .maestro/screenshots/asha-chat-seed.yaml
          capture asha-chat-default
          xcrun simctl ui "$SIM_UDID" content_size extra-large
          capture asha-chat-larger
          find named-screenshots -name '*.png' | sort
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: asha-chat-screenshots-${{ github.run_id }}
          path: |
            named-screenshots
            maestro-artifacts-seed
            maestro-artifacts-asha-chat-default
            maestro-artifacts-asha-chat-larger
          if-no-files-found: warn
          retention-days: 14
      - name: Clean up simulator and DerivedData
        if: always()
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl delete "$SIM_UDID" || true
          rm -rf ~/Library/Developer/Xcode/DerivedData/Bolo* || true
