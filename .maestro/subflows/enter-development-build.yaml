appId: com.bolo.hindi
---
# The dev launcher can surface an iOS "Open in Bolo?" URL prompt on launch.
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Bolo, http://.*:8081"
    optional: true
- extendedWaitUntil:
    visible: ".*(Where are you starting|This is the developer menu).*"
    timeout: 30000
# Onboarding's own footer has a Continue button, so only dismiss the developer
# menu's Continue when that menu is actually showing.
- runFlow:
    label: Dismiss the developer menu when it covers the app
    when:
      visible: ".*This is the developer menu.*"
    commands:
      - tapOn:
          text: "Continue"
          optional: true
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    text: "Dismiss"
    optional: true
