appId: com.bolo.hindi
---
# Relaunching a development build can reopen the Expo dev menu over the app.
# A slow menu used to appear after this wait and cover the next assertion.
- extendedWaitUntil:
    visible: "Runtime version.*"
    timeout: 15000
    optional: true
- tapOn:
    id: "xmark"
    optional: true
- tapOn:
    text: "Dismiss"
    optional: true
