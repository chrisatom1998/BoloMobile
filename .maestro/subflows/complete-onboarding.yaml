appId: com.bolo.hindi
---
# Onboarding is five single-question steps with Back / Continue pinned at the
# bottom. Each step has a valid default, so Continue is enabled throughout.
- assertVisible: "Where are you starting?"
- tapOn: "Continue"
- assertVisible: "How should Hindi appear?"
- tapOn: "Continue"
- assertVisible: "What matters most?"
- tapOn: "Continue"
- assertVisible: "Asha’s replies"
- tapOn: "Continue"
- assertVisible: "Daily practice target"
- tapOn: "Build my practice plan"
- extendedWaitUntil:
    visible: "Bolo"
    timeout: 15000
