appId: com.bolo.hindi
---
- extendedWaitUntil:
    visible: "Say namaste"
    timeout: 20000
# The simulator has no reliable microphone, so the first word is said later.
- tapOn:
    id: "say-it-skip"
- extendedWaitUntil:
    visible: "Your plan"
    timeout: 15000
- tapOn:
    id: "onboarding-start"
- extendedWaitUntil:
    visible: "Namaste"
    timeout: 15000
