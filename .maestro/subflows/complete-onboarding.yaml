appId: com.bolo.hindi
---
- extendedWaitUntil:
    visible: "Hear this"
    timeout: 20000
- tapOn:
    id: "onboarding-reply-namaste"
- tapOn:
    id: "onboarding-continue"
- extendedWaitUntil:
    visible: "Where are you starting?"
    timeout: 15000
- tapOn:
    id: "onboarding-continue"
- extendedWaitUntil:
    visible: "Meet Asha"
    timeout: 15000
- tapOn:
    id: "onboarding-start"
# Setup now opens the learner's first lesson. Close it so each flow still starts from Today.
- extendedWaitUntil:
    visible:
      id: "scene-close"
    timeout: 15000
- tapOn:
    id: "scene-close"
- extendedWaitUntil:
    visible: "Namaste"
    timeout: 15000
