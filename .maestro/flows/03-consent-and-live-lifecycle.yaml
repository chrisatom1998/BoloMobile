appId: com.bolo.hindi
name: Consent acceptance, microphone denial, withdrawal, and live cleanup
tags:
  - critical
  - privacy
  - voice
---
- launchApp:
    clearState: true
    permissions:
      microphone: deny
- runFlow: ../subflows/enter-development-build.yaml
- tapOn:
    text: "Don’t Allow"
    optional: true
- runFlow: ../subflows/complete-onboarding.yaml
- openLink: "bolo://live"
- assertNotVisible: "Live translate"
- scrollUntilVisible:
    element:
      text: "I agree and want to continue"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 20000
- tapOn: "I agree and want to continue"
- tapOn:
    id: "message-asha-input"
- inputText: "How do I say thank you?"
- tapOn:
    id: "send-asha-message"
- extendedWaitUntil:
    visible: ".*[Dd]hanyavaad.*"
    timeout: 60000
- extendedWaitUntil:
    notVisible: "Asha is thinking…"
    timeout: 60000
- assertNotVisible: ".*(voice audio could not play|Voice playback failed).*"
- scrollUntilVisible:
    element:
      text: "Start a voice conversation"
    direction: UP
    timeout: 20000
- tapOn:
    id: "realtime-voice-orb"
- tapOn:
    text: "Don’t Allow"
    optional: true
- assertVisible: ".*(Microphone access is required for live voice practice|Live voice requires a physical iPhone).*"
- setPermissions:
    permissions:
      microphone: allow
- stopApp
- launchApp
- tapOn:
    text: "Dismiss"
    optional: true
- openLink: "bolo://live"
- tapOn:
    id: "realtime-voice-orb"
- extendedWaitUntil:
    visible: ".*(Asha is listening|Live voice requires a physical iPhone).*"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Go to Today"
    direction: UP
    timeout: 20000
- tapOn: "Go to Today"
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Withdraw consent"
    direction: DOWN
- tapOn: "Withdraw consent"
- tapOn: "Withdraw"
- assertVisible: "AI consent withdrawn"
- tapOn: "OK"
- assertVisible: "Before using Asha"
- pressKey: Home
- launchApp:
    stopApp: false
- tapOn:
    text: "Dismiss"
    optional: true
- assertVisible: "Settings"
