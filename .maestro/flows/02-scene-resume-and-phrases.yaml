appId: com.bolo.hindi
name: Scene resume, completion, and saved phrase persistence
tags:
  - critical
  - learning
---
- launchApp:
    arguments:
      EXDevMenuIsOnboardingFinished: true
      EXDevMenuShowsAtLaunch: false
      EXDevMenuShowFloatingActionButton: false
    clearState: true
- runFlow: ../subflows/enter-development-build.yaml
- runFlow: ../subflows/complete-onboarding.yaml
- openLink: bolo://scene/chai
- tapOn:
    text: "Open"
    optional: true
- scrollUntilVisible:
    element:
      id: "scene-choice-0"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "scene-choice-0"
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
    timeout: 20000
- tapOn: "Continue"
- scrollUntilVisible:
    element:
      text: "Turn 2 of [0-9]+"
    direction: UP
    timeout: 20000
- assertVisible: "Turn 2 of [0-9]+"
- stopApp
- launchApp:
    arguments:
      EXDevMenuIsOnboardingFinished: true
      EXDevMenuShowsAtLaunch: false
      EXDevMenuShowFloatingActionButton: false
- runFlow: ../subflows/dismiss-dev-menu.yaml
- openLink: bolo://scene/chai
- tapOn:
    text: "Open"
    optional: true
- scrollUntilVisible:
    element:
      text: "Turn 2 of [0-9]+"
    direction: UP
    timeout: 20000
- assertVisible: "Turn 2 of [0-9]+"
- scrollUntilVisible:
    element:
      id: "scene-choice-0"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "scene-choice-0"
- scrollUntilVisible:
    element:
      text: "Save phrase"
    direction: DOWN
    timeout: 20000
- tapOn: "Save phrase"
- scrollUntilVisible:
    element:
      text: "Finish"
    direction: DOWN
    timeout: 20000
- tapOn: "Finish"
- assertVisible:
    id: "scene-completion-title"
- stopApp
- launchApp:
    arguments:
      EXDevMenuIsOnboardingFinished: true
      EXDevMenuShowsAtLaunch: false
      EXDevMenuShowFloatingActionButton: false
- runFlow: ../subflows/dismiss-dev-menu.yaml
- openLink: "bolo://phrases"
- tapOn:
    text: "Open"
    optional: true
- runFlow: ../subflows/dismiss-dev-menu.yaml
- assertVisible: "Words you want to keep."
- tapOn:
    id: "saved-phrase-listen"
- assertVisible: ".*चीनी कम, कृपया।.*"
- assertNotVisible: ".*Offline lesson audio failed.*"
