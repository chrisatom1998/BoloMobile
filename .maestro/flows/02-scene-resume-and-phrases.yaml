appId: com.bolo.hindi
name: Scene resume, completion, and saved phrase persistence
tags:
  - critical
  - learning
---
- launchApp:
    clearState: true
- runFlow: ../subflows/enter-development-build.yaml
- runFlow: ../subflows/complete-onboarding.yaml
- openLink: bolo://scene/chai
- scrollUntilVisible:
    element:
      text: ".*One tea, please.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*One tea, please.*"
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
    timeout: 20000
- tapOn: "Continue"
- scrollUntilVisible:
    element:
      text: "Turn 2 of 2"
    direction: UP
    timeout: 20000
- assertVisible: "Turn 2 of 2"
- stopApp
- launchApp
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn: "Continue"
- scrollUntilVisible:
    element:
      text: "Turn 2 of 2"
    direction: UP
    timeout: 20000
- assertVisible: "Turn 2 of 2"
- scrollUntilVisible:
    element:
      text: ".*Less sugar, please.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*Less sugar, please.*"
- scrollUntilVisible:
    element:
      text: "Save phrase"
    direction: DOWN
    timeout: 20000
- tapOn: "Save phrase"
- scrollUntilVisible:
    element:
      text: "Finish"
    direction: DOWN
    timeout: 20000
- tapOn: "Finish"
- assertVisible: "Scene complete"
- stopApp
- launchApp
- tapOn:
    text: "Dismiss"
    optional: true
- openLink: "bolo://phrases"
- tapOn:
    text: "Dismiss"
    optional: true
- assertVisible: "Words you want to keep."
- tapOn:
    id: "saved-phrase-listen"
- assertVisible: ".*चीनी कम, कृपया।.*"
- assertNotVisible: ".*Offline lesson audio failed.*"
