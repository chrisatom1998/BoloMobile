appId: com.bolo.hindi
name: GPT-Live microphone controls in English and Hindi reply modes
# Requires a physical iPhone and a build with BOLO_LIVE_API_URL configured.
# Configuration, model-access, and simulator errors must fail this device flow.
tags:
  - critical
  - voice
---
- launchApp:
    clearState: true
    permissions:
      microphone: allow
- runFlow: ../subflows/enter-development-build.yaml
- tapOn:
    text: "Allow"
    optional: true
- runFlow: ../subflows/complete-onboarding.yaml
- tapOn: "Asha"
- scrollUntilVisible:
    element:
      text: "Enable live practice"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 20000
- tapOn: "Enable live practice"
- tapOn:
    id: "realtime-voice-orb"
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible: "Your microphone is on"
    timeout: 30000
- assertVisible: "Listening"
- assertVisible: "Mute microphone"
- assertVisible: "Fixed until End"
# The labeled Mute control in the call bar mirrors the portrait tap.
- tapOn:
    id: "live-call-mute"
- extendedWaitUntil:
    visible: "Unmute microphone"
    timeout: 15000
- assertVisible: ".*(Your microphone is muted|Asha is speaking).*"
- assertVisible: ".*(Muted|Speaking).*"
- tapOn:
    id: "realtime-voice-orb"
- extendedWaitUntil:
    visible: "Your microphone is on"
    timeout: 15000
- tapOn:
    id: "live-call-end"
- assertVisible: "Ready when you are"
- assertVisible: "Start a voice conversation"
- assertNotVisible: "Fixed until End"
- scrollUntilVisible:
    element:
      text: "Asha voice language: Hindi"
    direction: UP
    visibilityPercentage: 100
    centerElement: true
    timeout: 20000
- tapOn: "Asha voice language: Hindi"
- assertVisible: ".*Hindi replies"
- tapOn:
    id: "realtime-voice-orb"
- extendedWaitUntil:
    visible: "Your microphone is on"
    timeout: 30000
- tapOn:
    id: "realtime-voice-orb"
- extendedWaitUntil:
    visible: "Unmute microphone"
    timeout: 15000
- assertVisible: ".*(Your microphone is muted|Asha is speaking).*"
- tapOn: "End live voice session"
- assertVisible: "Ready when you are"
- assertVisible: "Start a voice conversation"
