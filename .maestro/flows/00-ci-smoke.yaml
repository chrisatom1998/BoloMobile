appId: com.bolo.hindi
name: iOS launch, consent, persistence, and deletion-cancel smoke
tags:
  - smoke
  - ios
---
- launchApp:
    arguments:
      EXDevMenuIsOnboardingFinished: true
      EXDevMenuShowsAtLaunch: false
      EXDevMenuShowFloatingActionButton: false
    clearState: true
    clearKeychain: true
    permissions:
      microphone: deny
- runFlow: ../subflows/enter-development-build.yaml
- assertVisible: "Hear this"
- runFlow: ../subflows/complete-onboarding.yaml
- tapOn: "Asha"
- scrollUntilVisible:
    element:
      text: "Before your first live conversation"
    direction: DOWN
    speed: 60
    visibilityPercentage: 80
    centerElement: false
    timeout: 45000
- assertVisible: "Before your first live conversation"
- scrollUntilVisible:
    element:
      text: "Enable live practice"
    direction: DOWN
    speed: 60
    visibilityPercentage: 80
    centerElement: false
    timeout: 45000
- assertVisible: "Enable live practice"
- stopApp
- launchApp:
    arguments:
      EXDevMenuIsOnboardingFinished: true
      EXDevMenuShowsAtLaunch: false
      EXDevMenuShowFloatingActionButton: false
- runFlow: ../subflows/dismiss-dev-menu.yaml
# The onboarding heading is also absent while the launch screen is still showing.
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
- assertNotVisible: "Hear this"
- tapOn: "Settings"
- assertVisible: "Learning preferences"
- scrollUntilVisible:
    element:
      text: "Delete my Bolo data"
    direction: DOWN
    speed: 60
    visibilityPercentage: 80
    centerElement: false
    timeout: 45000
- tapOn: "Delete my Bolo data"
- assertVisible: "Delete your Bolo data?"
- tapOn: "Cancel"
- assertNotVisible: "Delete your Bolo data?"
- assertVisible: "Delete my Bolo data"
