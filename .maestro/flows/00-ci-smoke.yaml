appId: com.bolo.hindi
name: iOS launch, consent, persistence, and deletion-cancel smoke
tags:
  - smoke
  - ios
---
- launchApp:
    arguments:
      EXDevMenuIsOnboardingFinished: true
      EXDevMenuShowsAtLaunch: false
      EXDevMenuShowFloatingActionButton: false
    clearState: true
    clearKeychain: true
    permissions:
      microphone: deny
- runFlow: ../subflows/enter-development-build.yaml
- assertVisible: "Where are you starting?"
- assertVisible: "1 of 5"
# Onboarding no longer checks the microphone; the live path asks on connect. The
# smoke run instead walks the step footer: Continue advances, the script step
# previews the same sentence in each option, and Back keeps the earlier edit.
- tapOn: "Beginner, I know greetings and a few phrases."
- tapOn: "Continue"
- assertVisible: "How should Hindi appear?"
- assertVisible: "2 of 5"
- assertVisible: "aap kaise hain?"
- tapOn: "Back"
- assertVisible: "Where are you starting?"
- assertVisible: "1 of 5"
- runFlow: ../subflows/complete-onboarding.yaml
- tapOn: "Asha"
- scrollUntilVisible:
    element:
      text: "Before your first live conversation"
    direction: DOWN
    speed: 60
    visibilityPercentage: 80
    centerElement: false
    timeout: 45000
- assertVisible: "Before your first live conversation"
- scrollUntilVisible:
    element:
      text: "Enable live practice"
    direction: DOWN
    speed: 60
    visibilityPercentage: 80
    centerElement: false
    timeout: 45000
- assertVisible: "Enable live practice"
- stopApp
- launchApp:
    arguments:
      EXDevMenuIsOnboardingFinished: true
      EXDevMenuShowsAtLaunch: false
      EXDevMenuShowFloatingActionButton: false
- runFlow: ../subflows/dismiss-dev-menu.yaml
# The onboarding heading is also absent while the launch screen is still showing.
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
- assertNotVisible: "Where are you starting?"
- tapOn: "Settings"
- assertVisible: "Learning preferences"
- scrollUntilVisible:
    element:
      text: "Delete my Bolo data"
    direction: DOWN
    speed: 60
    visibilityPercentage: 80
    centerElement: false
    timeout: 45000
- tapOn: "Delete my Bolo data"
- assertVisible: "Delete your Bolo data?"
- tapOn: "Cancel"
- assertNotVisible: "Delete your Bolo data?"
- assertVisible: "Delete my Bolo data"
