appId: com.bolo.hindi
name: iOS launch, consent, persistence, and deletion-cancel smoke
tags:
  - smoke
  - ios
---
- launchApp:
    arguments:
      EXDevMenuIsOnboardingFinished: true
      EXDevMenuShowsAtLaunch: false
      EXDevMenuShowFloatingActionButton: false
    clearState: true
    clearKeychain: true
    permissions:
      microphone: deny
- runFlow: ../subflows/enter-development-build.yaml
- assertVisible: "Say namaste"
- runFlow: ../subflows/complete-onboarding.yaml
# PR screenshots only: optional steps, then back to the collapsed card.
- runFlow: ../subflows/today-screenshots.yaml
- tapOn: "Asha"
# The CI build has no live URL, so Talk with Asha is hidden and Type to Asha
# opens the same consent sheet. The invite sits above that button. VoiceOver
# hears "Asha says:" plus the line, and scrolling the button to 80% visible
# pushes that line off the top.
- assertVisible: ".*Greet me like a neighbor and tell me your name.*"
- scrollUntilVisible:
    element:
      text: "Type to Asha"
    direction: DOWN
    speed: 60
    visibilityPercentage: 80
    centerElement: false
    timeout: 45000
- assertVisible: "Type to Asha"
- tapOn: "Type to Asha"
- assertVisible: "Before your first live conversation"
- scrollUntilVisible:
    element:
      text: "Enable live practice"
    direction: DOWN
    speed: 60
    visibilityPercentage: 80
    centerElement: false
    timeout: 45000
- assertVisible: "Enable live practice"
- stopApp
- launchApp:
    arguments:
      EXDevMenuIsOnboardingFinished: true
      EXDevMenuShowsAtLaunch: false
      EXDevMenuShowFloatingActionButton: false
- runFlow: ../subflows/dismiss-dev-menu.yaml
# The onboarding heading is also absent while the launch screen is still showing.
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
- assertNotVisible: "Say namaste"
# A press highlight can satisfy Maestro's tap without opening Settings. Try once more.
- tapOn:
    id: "today-settings"
- extendedWaitUntil:
    optional: true
    visible: "Learning preferences"
    timeout: 8000
- tapOn:
    optional: true
    id: "today-settings"
- assertVisible: "Learning preferences"
- scrollUntilVisible:
    element:
      text: "Delete my Bolo data"
    direction: DOWN
    speed: 60
    visibilityPercentage: 80
    centerElement: false
    timeout: 45000
- tapOn: "Delete my Bolo data"
- assertVisible: "Delete your Bolo data?"
- tapOn: "Cancel"
- assertNotVisible: "Delete your Bolo data?"
- assertVisible: "Delete my Bolo data"
# PR screenshots only, after every smoke assertion: Today at the largest text size.
- runFlow: ../subflows/today-largest-text-screenshots.yaml
