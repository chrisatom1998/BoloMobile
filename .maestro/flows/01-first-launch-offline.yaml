appId: com.bolo.hindi
name: First launch, hydration, microphone denial, and offline lesson
tags:
  - critical
  - offline
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      microphone: deny
- assertVisible: "Your Hindi plan in one minute"
- scrollUntilVisible:
    element:
      text: "Check microphone access"
    direction: DOWN
- tapOn: "Check microphone access"
- scrollUntilVisible:
    element:
      text: "Microphone access is off. Typed and written practice still work."
    direction: DOWN
    timeout: 20000
- assertVisible: "Microphone access is off. Typed and written practice still work."
- runFlow: ../subflows/complete-onboarding.yaml
- stopApp
- launchApp
- assertNotVisible: "Your Hindi plan in one minute"
- setAirplaneMode: enabled
- openLink: bolo://scene/chai
- assertVisible: "Turn 1 of 2"
- scrollUntilVisible:
    element:
      text: "Hear Asha"
    direction: DOWN
    timeout: 20000
- tapOn: "Hear Asha"
- scrollUntilVisible:
    element:
      text: ".*एक चाय दीजिए।.*"
    direction: DOWN
    timeout: 20000
- assertVisible: ".*एक चाय दीजिए।.*"
- setAirplaneMode: disabled
