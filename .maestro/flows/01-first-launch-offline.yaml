appId: com.bolo.hindi
name: First launch, hydration, microphone denial, and offline lesson
tags:
  - critical
  - offline
---
- launchApp:
    arguments:
      EXDevMenuIsOnboardingFinished: true
      EXDevMenuShowsAtLaunch: false
      EXDevMenuShowFloatingActionButton: false
    clearState: true
    clearKeychain: true
    permissions:
      microphone: deny
- runFlow: ../subflows/enter-development-build.yaml
- assertVisible: "Where are you starting?"
- assertVisible: "1 of 5"
# The microphone check left onboarding; live practice asks for permission when it
# connects, and the preset denial is exercised by the consent flow. Here the step
# footer must stay reachable without scrolling, and Back must keep an edit.
- tapOn: "Beginner, I know greetings and a few phrases."
- tapOn: "Continue"
- assertVisible: "How should Hindi appear?"
- tapOn: "Back"
- assertVisible: "Where are you starting?"
- runFlow: ../subflows/complete-onboarding.yaml
- stopApp
- launchApp:
    arguments:
      EXDevMenuIsOnboardingFinished: true
      EXDevMenuShowsAtLaunch: false
      EXDevMenuShowFloatingActionButton: false
- runFlow: ../subflows/dismiss-dev-menu.yaml
- assertNotVisible: "Where are you starting?"
- setAirplaneMode: enabled
- scrollUntilVisible:
    element:
      text: "Start speaking, plan 1 of 10, 0 of 10 lessons complete"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
    timeout: 20000
- tapOn: "Start speaking, plan 1 of 10, 0 of 10 lessons complete"
- scrollUntilVisible:
    element:
      text: "A warm hello, lesson 1 of 10, Next lesson"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
    timeout: 20000
- tapOn: "A warm hello, lesson 1 of 10, Next lesson"
- assertVisible: "Turn 1 of 10"
- scrollUntilVisible:
    element:
      text: "Hear Asha"
    direction: DOWN
    timeout: 20000
- tapOn: "Hear Asha"
- runFlow: ../subflows/dismiss-dev-menu.yaml
- scrollUntilVisible:
    element:
      text: ".*नमस्ते।.*"
    direction: DOWN
    timeout: 20000
- assertVisible: ".*नमस्ते।.*"
- setAirplaneMode: disabled
