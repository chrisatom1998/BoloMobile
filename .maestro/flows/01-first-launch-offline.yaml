appId: com.bolo.hindi
name: First launch, hydration, microphone denial, and offline lesson
tags:
  - critical
  - offline
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      microphone: deny
- runFlow: ../subflows/enter-development-build.yaml
- assertVisible: "Your Hindi plan in one minute"
- scrollUntilVisible:
    element:
      text: "Check microphone access"
    direction: DOWN
- tapOn: "Check microphone access"
- scrollUntilVisible:
    element:
      text: "Microphone access is off. Typed and written practice still work."
    direction: DOWN
    timeout: 20000
- assertVisible: "Microphone access is off. Typed and written practice still work."
- runFlow: ../subflows/complete-onboarding.yaml
- stopApp
- launchApp
- tapOn:
    text: "Dismiss"
    optional: true
- assertNotVisible: "Your Hindi plan in one minute"
- setAirplaneMode: enabled
- scrollUntilVisible:
    element:
      text: "Start speaking, plan 1 of 10, 0 of 10 lessons complete"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
    timeout: 20000
- tapOn: "Start speaking, plan 1 of 10, 0 of 10 lessons complete"
- scrollUntilVisible:
    element:
      text: "A warm hello, lesson 1 of 10, Next lesson"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
    timeout: 20000
- tapOn: "A warm hello, lesson 1 of 10, Next lesson"
- assertVisible: "Turn 1 of 10"
- scrollUntilVisible:
    element:
      text: "Hear Asha"
    direction: DOWN
    timeout: 20000
- tapOn: "Hear Asha"
- tapOn:
    text: "Dismiss"
    optional: true
- scrollUntilVisible:
    element:
      text: ".*नमस्ते।.*"
    direction: DOWN
    timeout: 20000
- assertVisible: ".*नमस्ते।.*"
- setAirplaneMode: disabled
