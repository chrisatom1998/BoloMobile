appId: com.bolo.hindi
name: First launch, hydration, microphone denial, and offline lesson
tags:
  - critical
  - offline
---
- launchApp:
    arguments:
      EXDevMenuIsOnboardingFinished: true
      EXDevMenuShowsAtLaunch: false
      EXDevMenuShowFloatingActionButton: false
    clearState: true
    clearKeychain: true
    permissions:
      microphone: deny
- runFlow: ../subflows/enter-development-build.yaml
- assertVisible: "Hear this"
- runFlow: ../subflows/complete-onboarding.yaml
- stopApp
- launchApp:
    arguments:
      EXDevMenuIsOnboardingFinished: true
      EXDevMenuShowsAtLaunch: false
      EXDevMenuShowFloatingActionButton: false
- runFlow: ../subflows/dismiss-dev-menu.yaml
- assertNotVisible: "Hear this"
- setAirplaneMode: enabled
- scrollUntilVisible:
    element:
      text: "Start speaking, plan 1 of 10, 0 of 10 lessons complete"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
    timeout: 20000
- tapOn: "Start speaking, plan 1 of 10, 0 of 10 lessons complete"
- scrollUntilVisible:
    element:
      text: "A warm hello, lesson 1 of 10, Next lesson"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
    timeout: 20000
- tapOn: "A warm hello, lesson 1 of 10, Next lesson"
- assertVisible: "Turn 1 of 10"
- scrollUntilVisible:
    element:
      text: "Hear Asha"
    direction: DOWN
    timeout: 20000
- tapOn: "Hear Asha"
- runFlow: ../subflows/dismiss-dev-menu.yaml
- scrollUntilVisible:
    element:
      text: ".*नमस्ते।.*"
    direction: DOWN
    timeout: 20000
- assertVisible: ".*नमस्ते।.*"
- setAirplaneMode: disabled
