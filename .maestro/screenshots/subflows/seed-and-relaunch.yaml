appId: com.bolo.hindi
---
- runFlow: launch-fresh.yaml
- openLink: "bolo://screenshot-fixture?name=${FIXTURE}"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "screenshot-fixture-ready"
    timeout: 30000
- stopApp
- launchApp:
    arguments:
      EXDevMenuIsOnboardingFinished: true
      EXDevMenuShowsAtLaunch: false
      EXDevMenuShowFloatingActionButton: false
- tapOn:
    text: "Open"
    optional: true
- runFlow: ../../subflows/dismiss-dev-menu.yaml
- extendedWaitUntil:
    visible: "Namaste"
    timeout: 60000
