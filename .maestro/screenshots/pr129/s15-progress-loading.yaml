appId: com.bolo.hindi
name: progress-loading
---
- launchApp:
    clearState: true
- openLink: "bolo://state-preview?screen=progress&phase=loading"
- extendedWaitUntil:
    visible: "Opening your progress"
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: progress-loading
