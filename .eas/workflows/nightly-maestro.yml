name: Nightly staging acceptance

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  staging_services:
    name: Validate staging services
    environment: preview
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Require staging-only endpoints
        run: node ./scripts/validate-production-config.mjs --validate-staging-endpoints
      - run: npm run e2e:validate
      - run: npm run release:validate:live
      - run: npm run acceptance:live

  build_ios:
    name: Build unsigned staging iOS Simulator app
    needs: [staging_services]
    type: build
    params:
      platform: ios
      profile: staging-e2e

  maestro_ios:
    name: Run all iOS-compatible staging flows
    needs: [build_ios]
    type: maestro
    environment: preview
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path:
        - .maestro/flows/00-ci-smoke.yaml
        - .maestro/flows/02-scene-resume-and-phrases.yaml
        - .maestro/flows/03-consent-and-live-lifecycle.yaml
        - .maestro/flows/04-data-deletion.yaml
        - .maestro/flows/05-realtime-voice-turns.yaml
      retries: 1
      retry_failed_only: true
      record_screen: true
