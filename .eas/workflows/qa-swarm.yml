name: QA Swarm

# iOS-only QA Swarm, from https://docs.expo.dev/agentic-workflows/qa-swarm/
# Changes from the guide: iOS lanes only; the existing staging-e2e profile
# (unsigned iOS Simulator build, preview environment); evidence sites stay
# private (no Expo Hosting deploy) and are uploaded as job artifacts.

on:
  workflow_dispatch: {}

jobs:
  fingerprint:
    type: fingerprint
    environment: preview

  get_build_ios:
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: staging-e2e
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build_ios:
    type: build
    needs: [get_build_ios]
    if: ${{ !needs.get_build_ios.outputs.build_id }}
    params:
      platform: ios
      profile: staging-e2e

  repack_ios:
    type: repack
    needs: [get_build_ios]
    if: ${{ needs.get_build_ios.outputs.build_id }}
    params:
      build_id: ${{ needs.get_build_ios.outputs.build_id }}
      profile: staging-e2e

  lane_ios_launch:
    needs: [get_build_ios]
    after: [build_ios, repack_ios]
    environment: preview
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      PLATFORM: ios
      FLOW: launch
    outputs:
      verdict: ${{ steps.lane.outputs.verdict }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: lane
        run: bash .eas/agents/qa-lane.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-ios-launch-evidence
          path: agent-output/evidence/**/*

  lane_ios_onboarding:
    needs: [get_build_ios]
    after: [build_ios, repack_ios]
    environment: preview
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      PLATFORM: ios
      FLOW: onboarding
    outputs:
      verdict: ${{ steps.lane.outputs.verdict }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: lane
        run: bash .eas/agents/qa-lane.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-ios-onboarding-evidence
          path: agent-output/evidence/**/*

  lane_ios_lesson:
    needs: [get_build_ios]
    after: [build_ios, repack_ios]
    environment: preview
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      PLATFORM: ios
      FLOW: lesson
    outputs:
      verdict: ${{ steps.lane.outputs.verdict }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: lane
        run: bash .eas/agents/qa-lane.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-ios-lesson-evidence
          path: agent-output/evidence/**/*

  lane_ios_tabs:
    needs: [get_build_ios]
    after: [build_ios, repack_ios]
    environment: preview
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      PLATFORM: ios
      FLOW: tabs
    outputs:
      verdict: ${{ steps.lane.outputs.verdict }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: lane
        run: bash .eas/agents/qa-lane.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-ios-tabs-evidence
          path: agent-output/evidence/**/*

  report:
    type: doc
    after: [lane_ios_launch, lane_ios_onboarding, lane_ios_lesson, lane_ios_tabs]
    params:
      md: |
        # QA Swarm report

        Evidence (screenshots, agent log, and the evidence site in site/index.html) is in the qa-ios-<flow>-evidence artifact of each lane job.

        - **iOS, launch:** ${{ after.lane_ios_launch.outputs.verdict || 'FAIL: The lane did not finish.' }}
        - **iOS, onboarding:** ${{ after.lane_ios_onboarding.outputs.verdict || 'FAIL: The lane did not finish.' }}
        - **iOS, lesson:** ${{ after.lane_ios_lesson.outputs.verdict || 'FAIL: The lane did not finish.' }}
        - **iOS, tabs:** ${{ after.lane_ios_tabs.outputs.verdict || 'FAIL: The lane did not finish.' }}
